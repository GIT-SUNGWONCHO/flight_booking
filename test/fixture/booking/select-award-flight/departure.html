<!doctype html><meta charset="utf-8"><title>조회 (픽스처)</title>
<h1>항공편 조회</h1>
<!-- 실측 구조: 검색 위젯의 날짜 입력칸. 좌석이 하나도 없을 때도 이건 남아 있어서
     "이 화면이 몇 일자를 조회 중인가" 를 알 수 있는 유일한 근거가 된다. -->
<div id="ang-flight-widget-detail">
  <div class="ang-flight-widget__item -dateinput">
    <kds-dateinput class="ang-dateinput">
      <kds-dateinput_1 class="--wds-ui ui-dateinput__host" id="depdate"></kds-dateinput_1>
    </kds-dateinput>
  </div>
  <div class="ang-flight-widget__item -dateinput">
    <kds-dateinput class="ang-dateinput">
      <kds-dateinput_1 class="--wds-ui ui-dateinput__host" id="retdate"></kds-dateinput_1>
    </kds-dateinput>
  </div>
</div>
<div id="shown"></div>

<!-- 실측(2026-08-28) 날짜 띠. 이걸 눌러야 페이지 이동 없이 다시 조회된다.
     위쪽 위젯(날짜칸 → 달력 → [항공편 검색])은 복불복이라 버렸다 - 달력 페이지로
     되돌아갈 때가 있는데, 그건 우리가 건너뛰려던 바로 그 페이지다. -->
<ul id="flexible-date"></ul>
  </div>
</div>
<div id="seatbox"></div>
<button id="next">다음</button>
<script>
(function () {
  window.__clicks = [];
  window.__loads = (+sessionStorage.getItem('loads') || 0) + 1;
  sessionStorage.setItem('loads', window.__loads);
  document.addEventListener('click', function (e) {
    // 우리 패널(ke-*)을 누른 것은 페이지 조작이 아니다 - 세지 않는다
    var t = e.target.closest('[id]');
    if (t && t.id.indexOf('ke-') !== 0) window.__clicks.push(t.id);
  }, true);
  /* opensAfter=N: 좌석이 N번째 로드부터 나타난다. 09:00 정각에 새로고침해도
     서버가 좌석을 조금 늦게 푸는 상황을 흉내낸다. */
  var opens = +(new URLSearchParams(location.search).get('opensAfter') || 1);
  var out = window.__loads >= opens;      // 이 날짜의 좌석이 이미 열렸는가
  /* drawAfter=N: 이 화면이 N밀리초 뒤에야 뜬다. 그동안은 조회 응답도 안 오고 운임
     카드도 없다 - "등급이 없다" 가 아니라 "아직 안 떴다" 인 상태다. 이걸 구분 못 해
     무한 새로고침만 하던 사고를 재현한다. */
  var drawAfter = +(new URLSearchParams(location.search).get('drawAfter') || 0);
  /* soldout=1: 그 날짜는 열렸고 화면도 떴는데(조회 응답은 온다) 프레스티지만 매진이다.
     클릭할 좌석 버튼이 없고, 서버 응답이 KEBONUSPR.soldout:true 로 말한다. */
  var soldOut = new URLSearchParams(location.search).get('soldout') === '1';
  function drawSeat() {
    if (!out || soldOut) return;
    /* 실제 화면은 편마다 "대한항공 운항" / "에어프랑스 운항" 표기를 달고, 운임 카드는
       그 블록 안에 들어 있다. findCabin 은 코드셰어를 거르려고 이 표기를 보므로
       픽스처도 같은 구조여야 한다. */
    var blk = document.createElement('div');
    blk.className = 'flight';
    var op = document.createElement('div');
    op.textContent = '편명 대한항공 운항 KE931';
    blk.appendChild(op);
    var b = document.createElement('button');
    b.id = 'seat'; b.textContent = 'KE931 ICN→FCO 프레스티지 62,500 마일';   // findCabin 은 등급명 + 마일 을 본다
    blk.appendChild(b);
    document.getElementById('seatbox').appendChild(blk);
  }
  if (drawAfter) setTimeout(drawSeat, drawAfter); else drawSeat();
  var m = /depDate=(\d{8})/.exec(location.search);
  var day = m ? m[1] : '20270821';
  document.getElementById('shown').textContent = '가는 날 ' + day;
  document.getElementById('depdate').textContent =
    day.slice(4, 6) + '월 ' + day.slice(6, 8) + '일 (토)';
  document.getElementById('retdate').textContent = '09월 05일 (일)';
  // empty=1: 아직 안 열린 날짜를 조회한 상태 - 좌석이 없어 API 에 날짜가 안 나온다
  if (location.search.indexOf('empty=1') >= 0) return;
  /* 실제 화면과 같이, 날짜와 좌석 수는 화면이 아니라 이 응답에서 온다.
     probe 가 이걸 읽어 "지금 어느 날을 보고 있나" 를 판정한다. */
  /* 날짜 띠. openTo 일까지만 '선택 가능' - 09:00 에 하루가 늘어나는 것을 흉내낸다.
     라벨에 월이 없다: "출발일 21 (토) 선택 가능" */
  var openTo = +(new URLSearchParams(location.search).get('openTo') || 21);
  /* deaf=N: 처음 N밀리초 동안은 클릭이 먹히지 않는다. 새로고침 직후에는 페이지
     스크립트가 아직 클릭 핸들러를 안 붙여 첫 클릭이 예외도 없이 사라진다 -
     실측에서 ▶ 재생 은 되는데 ▶ 대기 시작 은 그래서 안 됐다. */
  var deaf = +(new URLSearchParams(location.search).get('deaf') || 0);
  var born = Date.now();
  var strip = document.getElementById('flexible-date');
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  for (var d = 15; d <= 25; d++) {
    var li = document.createElement('li');
    li.className = 'flexible-date__item ng-star-inserted';
    var btn = document.createElement('button');
    var ok = d <= openTo;
    btn.className = 'flexible-date__link' + (ok ? ' -active' : '');
    btn.textContent = '출발일 ' + d + ' (' + DOW[d % 7] + ') '
                    + (ok ? '선택 가능' : '운항편 없음');
    (function (dd) {
      btn.addEventListener('click', function () {
        if (!this.classList.contains('-active')) return;
        if (Date.now() - born < deaf) return;      // 아직 핸들러가 안 붙은 셈
        var u = new URL(location.href);
        u.searchParams.set('depDate', '202708' + dd);
        location.href = u.toString();     // 실제로는 XHR 이지만 결과는 같다
      });
    })(('0' + d).slice(-2));
    li.appendChild(btn);
    strip.appendChild(li);
  }

  function ask() {
    var x = new XMLHttpRequest();
    x.open("GET", "/booking/select-award-flight/awardAvailability.json?d=" + day
                  + "&seats=" + (out ? '1' : '0') + (soldOut ? '&so=1' : ''));
    x.send();
  }
  if (drawAfter) setTimeout(ask, drawAfter); else ask();
})();
</script>
