<!doctype html><meta charset="utf-8"><title>조회 (픽스처)</title>
<h1>항공편 조회</h1>
<!-- 실측 구조: 검색 위젯의 날짜 입력칸. 좌석이 하나도 없을 때도 이건 남아 있어서
     "이 화면이 몇 일자를 조회 중인가" 를 알 수 있는 유일한 근거가 된다. -->
<div id="ang-flight-widget-detail">
  <div class="ang-flight-widget__item -dateinput">
    <kds-dateinput class="ang-dateinput">
      <kds-dateinput_1 class="--wds-ui ui-dateinput__host" id="depdate"></kds-dateinput_1>
    </kds-dateinput>
  </div>
  <div class="ang-flight-widget__item -dateinput">
    <kds-dateinput class="ang-dateinput">
      <kds-dateinput_1 class="--wds-ui ui-dateinput__host" id="retdate"></kds-dateinput_1>
    </kds-dateinput>
  </div>
</div>
<div id="shown"></div>

<!-- 실측 구조: 날짜칸을 누르면 이 달력이 열린다.
     #month202708 처럼 컨테이너 id 에 연월이 박혀 있고, 예약 가능한 날에만
     -available 이 붙는다. 라벨은 "18 18일, 수요일" 로 월이 없다. -->
<!-- 실측: #flight-widget__btn, 라벨 "항공편 검색" -->
<button id="flight-widget__btn">항공편 검색</button>
<div id="picker" style="display:none">
  <div></div>
  <div id="month202708">
    <div></div>
    <div>
      <table class="ui-datepicker__table"><tbody class="ui-datepicker__tbody">
        <tr class="ng-star-inserted"><td></td></tr>
      </tbody></table>
    </div>
  </div>
</div>
<div id="seatbox"></div>
<button id="next">다음</button>
<script>
(function () {
  window.__clicks = [];
  window.__loads = (+sessionStorage.getItem('loads') || 0) + 1;
  sessionStorage.setItem('loads', window.__loads);
  document.addEventListener('click', function (e) {
    // 우리 패널(ke-*)을 누른 것은 페이지 조작이 아니다 - 세지 않는다
    var t = e.target.closest('[id]');
    if (t && t.id.indexOf('ke-') !== 0) window.__clicks.push(t.id);
  }, true);
  /* opensAfter=N: 좌석이 N번째 로드부터 나타난다. 09:00 정각에 새로고침해도
     서버가 좌석을 조금 늦게 푸는 상황을 흉내낸다. */
  var opens = +(new URLSearchParams(location.search).get('opensAfter') || 1);
  var out = window.__loads >= opens;      // 이 날짜의 좌석이 이미 열렸는가
  if (out) {
    var b = document.createElement('button');
    b.id = 'seat'; b.textContent = 'KE931 ICN→FCO 프레스티지 62,500 마일';   // findCabin 은 등급명 + 마일 을 본다
    document.getElementById('seatbox').appendChild(b);
  }
  var m = /depDate=(\d{8})/.exec(location.search);
  var day = m ? m[1] : '20270821';
  document.getElementById('shown').textContent = '가는 날 ' + day;
  document.getElementById('depdate').textContent =
    day.slice(4, 6) + '월 ' + day.slice(6, 8) + '일 (토)';
  document.getElementById('retdate').textContent = '09월 05일 (일)';
  // empty=1: 아직 안 열린 날짜를 조회한 상태 - 좌석이 없어 API 에 날짜가 안 나온다
  if (location.search.indexOf('empty=1') >= 0) return;
  /* 실제 화면과 같이, 날짜와 좌석 수는 화면이 아니라 이 응답에서 온다.
     probe 가 이걸 읽어 "지금 어느 날을 보고 있나" 를 판정한다. */
  /* 예약 가능 창: openTo 일까지만 -available. 09:00 에 하루가 늘어나는 것을 흉내낸다. */
  var openTo = +(new URLSearchParams(location.search).get('openTo') || 21);
  var row = document.querySelector('#month202708 tr');
  row.innerHTML = '';
  for (var d = 16; d <= 25; d++) {
    var td = document.createElement('td');
    td.className = 'ui-datepicker__td' + (d <= openTo ? ' -available' : ' -disabled');
    td.textContent = d + ' ' + d + '일, 수요일';
    (function (dd) {
      td.addEventListener('click', function () {
        if (!this.classList.contains('-available')) return;
        /* 실측(2026-08-27): 날짜를 고르면 머리말만 바뀌고 목록은 그대로였다.
           재조회는 [조회] 를 눌러야 일어난다. */
        window.__picked = '202708' + dd;
        document.getElementById('depdate').textContent =
          '08월 ' + dd + '일 (수)';
        document.getElementById('picker').style.display = 'none';
      });
    })(('0' + d).slice(-2));
    row.appendChild(td);
  }
  /* deaf=N: 처음 N밀리초 동안은 날짜칸 클릭이 먹히지 않는다.
     실제 화면이 그렇다 - 새로고침 직후에는 페이지 스크립트가 아직 클릭 핸들러를
     붙이지 않아 첫 클릭이 예외도 없이 사라진다. 한 번만 누르고 기다리면 영원히
     안 열린다(실측: 재생은 되는데 대기 시작은 여기서 멈췄다). */
  var deaf = +(new URLSearchParams(location.search).get('deaf') || 0);
  var born = Date.now();
  document.getElementById('depdate').addEventListener('click', function () {
    if (Date.now() - born < deaf) return;      // 아직 안 붙은 셈
    document.getElementById('picker').style.display = '';
  });
  // nosearch=1: 조회 버튼 라벨이 우리가 아는 말이 아닌 경우를 흉내낸다
  // nosearch=1: id 도 라벨도 우리가 아는 것이 아닌 경우
  if (location.search.indexOf('nosearch=1') >= 0) {
    var b = document.getElementById('flight-widget__btn');
    b.id = 'somethingelse';
    b.textContent = '알 수 없는 버튼';
  }
  document.getElementById('flight-widget__btn').addEventListener('click', function () {
    if (!window.__picked) return;
    var u = new URL(location.href);
    u.searchParams.set('depDate', window.__picked);
    location.href = u.toString();      // 실제로는 XHR 이지만 결과는 같다
  });

  var x = new XMLHttpRequest();
  x.open("GET", "/booking/select-award-flight/awardAvailability.json?d=" + day
                + "&seats=" + (out ? '1' : '0'));
  x.send();
})();
</script>
