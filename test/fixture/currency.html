<!doctype html>
<meta charset="utf-8"><title>통화/결제수단 시뮬레이터</title>
<style>body{font:14px sans-serif;padding:20px} button{padding:8px 14px;margin:4px}
 #opts{display:none} #opts.on{display:block}</style>
<body>
<!-- ?cur=USD 면 통화가 USD 로 시작한다 (좌석 등급을 바꾸면 되돌아가는 상황).
     ?npay=0 이면 네이버페이가 없다 (오는 편). -->
<button id="currencyBtn">통화 <span id="curval">KRW</span></button>
<div id="filter-currency" style="display:none">
  <div class="filter__contents">
    <div class="filter__list">
      <div class="selection filter__item"><label data-v="USD">USD</label></div>
      <div class="selection filter__item"><label data-v="KRW">KRW</label></div>
    </div>
    <button class="filter__apply">적용</button>
  </div>
</div>
<hr>
<div id="pays"></div>
<script>
var q = new URLSearchParams(location.search);
window.__curClicks = 0; window.__picked = null;
if (q.get('cur') === 'USD') document.getElementById('curval').textContent = 'USD';
var pending = null;
document.getElementById('currencyBtn').onclick = function () {
  window.__curClicks++;
  document.getElementById('filter-currency').style.display = 'block';
};
document.querySelectorAll('#filter-currency label').forEach(function (b) {
  b.onclick = function () { pending = b.dataset.v; };   // 고르기만 하고 반영은 [적용] 에서
});
document.querySelector('.filter__apply').onclick = function () {
  if (pending) document.getElementById('curval').textContent = pending;
  document.getElementById('filter-currency').style.display = 'none';
  window.__applied = (window.__applied || 0) + 1;
};
var html = '';
if (q.get('npay') !== '0') html += '<button id="npay">Npay</button>';
html += '<button id="card">한국발행 신용/체크카드</button>';
/* 카드로 갈 때만 종류 드롭다운이 나타난다. 기본은 "선택" 이라 골라줘야 한다.
   네이버페이로 가면 이 영역이 아예 없다 - optional 단계가 넘어가야 하는 상황. */
if (q.get('npay') === '0') {
  html += '<div><button id="cardtype">한국발행 신용/체크카드 종류 <span id="ctval">선택</span></button>'
        + '<div id="ctopts" style="display:none">'
        + '<button class="ct" data-v="현대카드">현대카드</button>'
        + '<button class="ct" data-v="하나카드(구 외환, 하나SK)">하나카드(구 외환, 하나SK)</button>'
        + '</div></div>';
}
document.getElementById('pays').innerHTML = html;
document.querySelectorAll('#pays > button').forEach(function (b) {
  b.onclick = function () { window.__picked = b.id; };
});
window.__ctClicks = 0;
var ct = document.getElementById('cardtype');
if (ct) {
  ct.onclick = function () {
    window.__ctClicks++;
    document.getElementById('ctopts').style.display = 'block';
  };
  document.querySelectorAll('.ct').forEach(function (b) {
    b.onclick = function () {
      document.getElementById('ctval').textContent = b.dataset.v;
      document.getElementById('ctopts').style.display = 'none';
    };
  });
}
</script>
</body>
