<!doctype html>
<meta charset="utf-8"><title>통화/결제수단 시뮬레이터</title>
<style>body{font:14px sans-serif;padding:20px} button{padding:8px 14px;margin:4px}
 #opts{display:none} #opts.on{display:block}</style>
<body>
<!-- ?cur=USD 면 통화가 USD 로 시작한다 (좌석 등급을 바꾸면 되돌아가는 상황).
     ?npay=0 이면 네이버페이가 없다 (오는 편). -->
<button id="cur">통화 <span id="curval">KRW</span></button>
<div id="opts">
  <button class="opt" data-v="KRW">KRW 대한민국 원</button>
  <button class="opt" data-v="USD">USD 미국 달러</button>
</div>
<hr>
<div id="pays"></div>
<script>
var q = new URLSearchParams(location.search);
window.__curClicks = 0; window.__picked = null;
if (q.get('cur') === 'USD') document.getElementById('curval').textContent = 'USD';
document.getElementById('cur').onclick = function () {
  window.__curClicks++;
  document.getElementById('opts').className = 'on';
};
document.querySelectorAll('.opt').forEach(function (b) {
  b.onclick = function () {
    document.getElementById('curval').textContent = b.dataset.v;
    document.getElementById('opts').className = '';
  };
});
var html = '';
if (q.get('npay') !== '0') html += '<button id="npay">Npay</button>';
html += '<button id="card">한국발행 신용/체크카드</button>';
document.getElementById('pays').innerHTML = html;
document.querySelectorAll('#pays button').forEach(function (b) {
  b.onclick = function () { window.__picked = b.id; };
});
</script>
</body>
